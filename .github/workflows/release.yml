name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        env:
          PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./debug-info/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privatelm-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-*/*.apk

      - name: Upload debug-info
        uses: actions/upload-artifact@v4
        with:
          name: privatelm-debug-info-${{ github.ref_name }}
          path: debug-info/
