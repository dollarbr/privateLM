name: Android Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # release notes diff against the previous tag

      - name: Check tag matches pubspec version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pubspec=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -1)
          if [ "$pubspec" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pubspec version $pubspec"
            exit 1
          fi
          echo "Version $TAG"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # One build with --split-per-abi, not two builds. Without that flag a
      # single --target-platform emits plain app-release.apk, so the second
      # build silently overwrote the first and no per-ABI file ever existed.
      - name: Build APKs
        env:
          PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING: "true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=utf-8 -Dkotlin.daemon.jvm.options=-Xmx4g"
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64

      - name: Name APKs after the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd build/app/outputs/flutter-apk
          ls -1 # surfaces a naming mismatch here rather than in the mv below
          mv app-arm64-v8a-release.apk    "PrivateLM-$TAG-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk  "PrivateLM-$TAG-armeabi-v7a.apk"
          ls -lh PrivateLM-*.apk

      - name: Generate release notes from commits
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          echo "Comparing ${prev:-start of history} .. $TAG"

          # Conventional-commit prefixes bucketed explicitly. Anything matching
          # none of them lands in "Other" — no commit is silently dropped.
          known='^(feat|fix|ci|build|chore|docs|refactor|perf|style|test)(\([^)]*\))?!?:'

          log() { git log --no-merges --pretty='%s%x09%h' "$range"; }
          fmt() {
            sed -E 's/^[a-z]+(\([^)]*\))?!?: *//' \
              | awk -F'\t' '{printf "- %s (%s)\n", $1, $2}'
          }
          section() { # $1 = heading, $2 = pre-formatted bullets
            if [ -n "$2" ]; then printf '### %s\n%s\n\n' "$1" "$2"; fi
          }

          {
            printf '## PrivateLM %s\n\n' "$TAG"
            section 'Features'    "$(log | grep -E '^feat(\([^)]*\))?!?:' | fmt)"
            section 'Fixes'       "$(log | grep -E '^fix(\([^)]*\))?!?:' | fmt)"
            section 'Build & CI'  "$(log | grep -E '^(ci|build|chore)(\([^)]*\))?!?:' | fmt)"
            section 'Maintenance' "$(log | grep -E '^(docs|refactor|perf|style|test)(\([^)]*\))?!?:' | fmt)"
            section 'Other'       "$(log | grep -Ev "$known" | fmt)"

            printf '### Downloads\n'
            printf -- '- `arm64-v8a` — most phones from 2017 onward\n'
            printf -- '- `armeabi-v7a` — older 32-bit devices\n\n'

            if [ -n "$prev" ]; then
              printf '**Full diff:** %s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$TAG"
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            build/app/outputs/flutter-apk/PrivateLM-*.apk
